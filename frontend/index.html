<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reflekt - Gestão de Tarefas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; display:flex; height:100vh; }
    .sidebar { width: 360px; border-right:1px solid #ddd; padding:16px; overflow:auto }
    .main { flex:1; padding:16px; overflow:auto }
    .task-card { border:1px solid #ccc; padding:8px; margin-bottom:8px; border-radius:4px; cursor:pointer }
    .task-card h4 { margin:0 0 4px 0 }
    .controls { display:flex; gap:8px; margin-bottom:8px }
    .detail { border-left:1px solid #eee; padding:16px }
    .notes { margin-top:12px }
    .note { border:1px dashed #bbb; padding:8px; margin-bottom:8px }
    label { display:block; margin-top:8px }
    input[type=text], textarea, select { width:100%; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Tarefas</h2>
    <div class="controls">
      <select id="filterStatus">
        <option value="">Todos</option>
        <option value="TODO">TODO</option>
        <option value="IN_PROGRESS">IN_PROGRESS</option>
        <option value="DONE">DONE</option>
      </select>
      <select id="filterPriority">
        <option value="">Todas</option>
        <option value="LOW">LOW</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="HIGH">HIGH</option>
        <option value="URGENT">URGENT</option>
      </select>
    </div>
    <input type="text" id="filterTag" placeholder="Filtrar por tag" />
    <div id="taskList"></div>

    <hr />
    <h3>Criar tarefa</h3>
    <form id="createTaskForm">
      <label>Título<input type="text" id="newTitle" required /></label>
      <label>Descrição<textarea id="newDescription"></textarea></label>
      <label>Prioridade
        <select id="newPriority">
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
          <option value="URGENT">URGENT</option>
        </select>
      </label>
      <label>Tags (vírgula)<input type="text" id="newTags" /></label>
      <button type="submit">Criar</button>
    </form>
  </div>

  <div class="main">
    <div id="detailPane">
      <h2>Detalhe</h2>
      <div id="detailContent">Selecione uma tarefa para ver detalhes</div>
    </div>
  </div>

  <script>
  // === CONFIG ===
  const API = 'http://localhost:3001/api/v1';

  // === API CLIENT ===
  async function getTasks(filters = {}) {
    const params = new URLSearchParams();
    if (filters.status) params.append('status', filters.status);
    if (filters.priority) params.append('priority', filters.priority);
    if (filters.tag) params.append('tag', filters.tag);
    const res = await fetch(API + '/tasks' + (params.toString() ? ('?' + params.toString()) : ''));
    return res.json();
  }

  async function createTask(data) {
    const res = await fetch(API + '/tasks', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    return res.json();
  }

  async function updateTask(id, data) {
    const res = await fetch(API + '/tasks/' + id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    return res.json();
  }

  async function deleteTask(id) {
    return fetch(API + '/tasks/' + id, { method:'DELETE' });
  }

  async function getNotes(taskId) {
    const res = await fetch(API + '/tasks/' + taskId + '/notes');
    return res.json();
  }

  async function createNote(taskId, data) {
    const res = await fetch(API + '/tasks/' + taskId + '/notes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    return res.json();
  }

  async function updateNote(taskId, id, data) {
    const res = await fetch(API + '/tasks/' + taskId + '/notes/' + id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    return res.json();
  }

  async function deleteNote(taskId, id) {
    return fetch(API + '/tasks/' + taskId + '/notes/' + id, { method:'DELETE' });
  }

  // === RENDER ===
  let currentTasks = [];
  let selectedTask = null;

  function renderTaskList(tasks) {
    currentTasks = tasks;
    const el = document.getElementById('taskList');
    el.innerHTML = '';
    tasks.forEach(t => {
      const div = document.createElement('div');
      div.className = 'task-card';
      div.innerHTML = `<h4>${escapeHtml(t.title)}</h4><div>${t.priority} • ${t.status}</div><div style="font-size:12px;color:#666">${t.tags.join(', ')}</div>`;
      div.onclick = () => selectTask(t.id);
      el.appendChild(div);
    });
  }

  async function renderTaskDetail(task, notes) {
    selectedTask = task;
    const el = document.getElementById('detailContent');
    el.innerHTML = '';
    const header = document.createElement('div');
    header.innerHTML = `<h3>${escapeHtml(task.title)}</h3><div>${task.description || ''}</div>`;
    el.appendChild(header);

    const editBtn = document.createElement('button');
    editBtn.textContent = 'Editar tarefa';
    editBtn.onclick = () => openEditTask(task);
    el.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.textContent = 'Excluir tarefa';
    delBtn.style.marginLeft = '8px';
    delBtn.onclick = async () => {
      await deleteTask(task.id);
      await reloadTasks();
      document.getElementById('detailContent').innerHTML = 'Selecione uma tarefa para ver detalhes';
    };
    el.appendChild(delBtn);

    const meta = document.createElement('div');
    meta.style.marginTop = '8px';
    meta.innerHTML = `<strong>Status:</strong> ${task.status} • <strong>Prioridade:</strong> ${task.priority} • <strong>Tags:</strong> ${task.tags.join(', ')}`;
    el.appendChild(meta);

    const notesTitle = document.createElement('h4');
    notesTitle.textContent = 'Notas';
    el.appendChild(notesTitle);

    const notesDiv = document.createElement('div');
    notesDiv.className = 'notes';
    notes.forEach(n => {
      const ndiv = document.createElement('div');
      ndiv.className = 'note';
      ndiv.innerHTML = `<div>${escapeHtml(n.content)}</div><div style="font-size:12px;color:#666">${n.created_at}</div>`;
      const edit = document.createElement('button'); edit.textContent = 'Editar';
      edit.onclick = () => openEditNote(n);
      const del = document.createElement('button'); del.textContent = 'Excluir'; del.onclick = async () => { await deleteNote(task.id, n.id); await selectTask(task.id); };
      ndiv.appendChild(edit); ndiv.appendChild(del);
      notesDiv.appendChild(ndiv);
    });
    el.appendChild(notesDiv);

    const form = document.createElement('form');
    form.onsubmit = async (e) => { e.preventDefault(); const content = input.value.trim(); if (!content) return alert('content é obrigatório'); await createNote(task.id, { content }); await selectTask(task.id); input.value=''; };
    const input = document.createElement('input'); input.type='text'; input.placeholder='Nova nota'; input.style.width='70%';
    const submit = document.createElement('button'); submit.type='submit'; submit.textContent='Adicionar nota';
    form.appendChild(input); form.appendChild(submit);
    el.appendChild(form);
  }

  // === HANDLERS ===
  async function handleCreateTask(e) {
    e.preventDefault();
    const title = document.getElementById('newTitle').value.trim();
    if (!title) return alert('title é obrigatório');
    const description = document.getElementById('newDescription').value;
    const priority = document.getElementById('newPriority').value;
    const tags = document.getElementById('newTags').value.split(',').map(s=>s.trim()).filter(Boolean);
    await createTask({ title, description, priority, tags });
    document.getElementById('createTaskForm').reset();
    await reloadTasks();
  }

  function openEditTask(task) {
    const el = document.getElementById('detailContent');
    el.innerHTML = '';
    const form = document.createElement('form');
    form.onsubmit = async (e) => { e.preventDefault(); const data = { title: title.value, description: desc.value, status: status.value, priority: priority.value, tags: tags.value.split(',').map(s=>s.trim()).filter(Boolean) }; await updateTask(task.id, data); await selectTask(task.id); await reloadTasks(); };
    const title = document.createElement('input'); title.type='text'; title.value = task.title; title.style.width='100%';
    const desc = document.createElement('textarea'); desc.value = task.description;
    const status = document.createElement('select'); ['TODO','IN_PROGRESS','DONE'].forEach(v => { const o = document.createElement('option'); o.value=v; o.textContent=v; if (v===task.status) o.selected=true; status.appendChild(o); });
    const priority = document.createElement('select'); ['LOW','MEDIUM','HIGH','URGENT'].forEach(v => { const o = document.createElement('option'); o.value=v; o.textContent=v; if (v===task.priority) o.selected=true; priority.appendChild(o); });
    const tags = document.createElement('input'); tags.value = task.tags.join(', ');
    const submit = document.createElement('button'); submit.type='submit'; submit.textContent='Salvar';
    form.appendChild(document.createTextNode('Título')); form.appendChild(title);
    form.appendChild(document.createTextNode('Descrição')); form.appendChild(desc);
    form.appendChild(document.createTextNode('Status')); form.appendChild(status);
    form.appendChild(document.createTextNode('Prioridade')); form.appendChild(priority);
    form.appendChild(document.createTextNode('Tags (vírgula)')); form.appendChild(tags);
    form.appendChild(submit);
    el.appendChild(form);
  }

  function openEditNote(note) {
    const txt = prompt('Editar nota', note.content);
    if (txt === null) return;
    updateNote(selectedTask.id, note.id, { content: txt }).then(()=> selectTask(selectedTask.id));
  }

  function handleFilterChange() {
    reloadTasks();
  }

  // === INIT ===
  document.getElementById('createTaskForm').addEventListener('submit', handleCreateTask);
  document.getElementById('filterStatus').addEventListener('change', handleFilterChange);
  document.getElementById('filterPriority').addEventListener('change', handleFilterChange);
  document.getElementById('filterTag').addEventListener('input', debounce(handleFilterChange, 300));

  async function reloadTasks() {
    const status = document.getElementById('filterStatus').value;
    const priority = document.getElementById('filterPriority').value;
    const tag = document.getElementById('filterTag').value.trim();
    const tasks = await getTasks({ status: status || undefined, priority: priority || undefined, tag: tag || undefined });
    renderTaskList(tasks);
  }

  async function selectTask(id) {
    const task = (await fetch(API + '/tasks/' + id).then(r=>r.json()));
    const notes = await getNotes(id);
    renderTaskDetail(task, notes);
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]); }

  function debounce(fn, wait) { let t; return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), wait); }; }

  // initial load
  reloadTasks();
  </script>
</body>
</html>
